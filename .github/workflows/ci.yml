name: CI

on:
  pull_request:
  push:
    branches: [main, "development/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      FINAI_MIGRATION_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: python -m pip install -e "services/api[dev]"
      - name: Provision restricted PostgreSQL runtime
        run: |
          mkdir -p .finai
          python scripts/provision-local.py
          python - <<'PY'
          import json, os
          with open('.finai/local.json') as source, open(os.environ['GITHUB_ENV'], 'a') as target:
              for key, value in json.load(source).items():
                  target.write(f'{key}={value}\n')
          PY
      - run: python -m ruff check services/api
      - run: python -m mypy services/api/src
      - run: python -m pytest services/api/tests
