[mypy]
python_version = 3.13

# The root CI command does not discover services/api/pyproject.toml.
# These are the same external, untyped libraries exempted by the API configuration.
# Keep the root command's existing checking scope; application errors remain errors.
[mypy-boto3,botocore.*,xlrd,openpyxl.*]
ignore_missing_imports = True
